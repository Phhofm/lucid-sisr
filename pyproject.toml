[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucid-sisr"
version = "3.0.0"
description = "Mathematical Integrity Filtering for SISR Datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Philip Hofmann", email = "phhofm@users.noreply.github.com"}
]
keywords = ["super-resolution", "dataset", "filtering", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "platformdirs>=3.0",
    "psutil>=5.9",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.65",
    "xxhash>=3.0",
]

[project.optional-dependencies]
# CLIP-IQA artifact filter (--clipiqa-threshold). Enabled by default when
# installed; the pipeline logs a warning and skips the stage when missing.
clipiqa = ["pyiqa>=0.1.10"]
iqa = ["pyiqa @ git+https://github.com/chaofengc/IQA-PyTorch.git", "transformers>=5.0"]
# HNSW approximate nearest-neighbour for dedupe (huge speedup + scales to
# 10M+ tiles). Falls back to brute-force cosine matmul if not installed.
ann = ["hnswlib>=0.7", "pyiqa>=0.1.10"]
# Intel ARC / discrete Intel GPU support (PyTorch XPU backend).
xpu = ["intel-extension-for-pytorch>=2.3"]
# AMD ROCm GPUs require a torch wheel built with HIP; this extra just
# records the version range to look for.
rocm = []
# Windows DirectML (last-resort acceleration on AMD/Intel iGPUs).
directml = ["torch-directml>=0.2"]
# matplotlib score-histogram plot in `lucid.core.filtering._write_score_artifacts`.
# Wrapped in try/except — LUCID runs fine without it, but the plot is
# generated only when installed.
plot = ["matplotlib>=3.7"]
dev = [
    "pytest>=7.0",
    "ruff>=0.2",
]
all = ["hnswlib>=0.7", "matplotlib>=3.7", "pyiqa>=0.1.10"]

[project.scripts]
lucid = "lucid.__main__:main"
lucid-gui = "lucid.gui:main"
lucid-calibrate = "lucid.calibrate:main"
lucid-calibrate-gates = "lucid.calibrate_gates:main"

[project.urls]
Homepage = "https://github.com/Phhofm/lucid-sisr"
Documentation = "https://github.com/Phhofm/lucid-sisr#readme"
Repository = "https://github.com/Phhofm/lucid-sisr"

[tool.setuptools.packages.find]
include = ["lucid*"]

[tool.setuptools.package-data]
lucid = ["resources/*.json", "resources/*.pth"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = [
    "E501",  # Line too long — tolerated for SQL strings and long URLs
    "N801",  # Class name `slam` / `conv_bn_relu` / `to_map` — model code,
             #     named to match the original ICNet paper, intentionally not CamelCase.
    "N806",  # Variable `resnet18Pretrained1` — same reason, model-internal naming.
    "N812",  # `import torch.nn.functional as F` — common PyTorch convention.
]

[tool.deptry.package_module_name_map]
"opencv-python" = ["cv2"]
pillow = ["PIL"]
"intel-extension-for-pytorch" = ["intel_extension_for_pytorch"]
"torch-directml" = ["torch_directml"]

[tool.deptry.known_first_party]
"calibrate_icnet" = "In-tree script, intentionally sys.path-injected from lucid.calibrate"
